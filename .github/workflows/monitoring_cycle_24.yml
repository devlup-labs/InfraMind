name: Monitoring_cycle_24

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, 00:00 UTC
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Retrain even if no drift is detected (for testing)"
        type: boolean
        default: false

concurrency:
  group: single_day_pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  model_drift_detection_retraining:
    name: Model Drift Detection & Retraining
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.MODEL_NAME }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect Concept Drift
        id: concept
        working-directory: ci_cd
        run: python detect_concept_drift.py

      - name: Detect Covariate Drift
        id: covariate
        working-directory: ci_cd
        run: python detect_covariate_drift.py

      # The separate "Set drift flag" step is no longer needed: the condition lives here.
      - name: Retrain Model
        if: >-
          steps.concept.outputs.concept_drift == 'true' ||
          steps.covariate.outputs.covariate_drift == 'true' ||
          github.event.inputs.force_retrain == 'true'
        working-directory: ci_cd
        run: python retrain_model.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-and-retrain-reports
          path: |
            ci_cd/artifacts/retrain_report.json
            ci_cd/artifacts/covariate_drift_report.html
          if-no-files-found: ignore