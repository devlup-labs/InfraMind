services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inframind-backend
 
    env_file:
      - ./agents/.env
    environment:

      - PROMETHEUS_URL=http://prometheus:9090
      - QDRANT_URL=http://qdrant:6333  
    ports:
      - "8000:8000"
    networks:
      - inframind-net
    depends_on:
      - prometheus
      - qdrant

  frontend:
    build:
      context: ./frontend/inframind
      dockerfile: Dockerfile
    container_name: inframind-frontend
    ports:
      - "30080:80"
    depends_on:
      - backend
    networks:
      - inframind-net

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: inframind-prometheus
    ports:
      - "9090:9090"
    networks:
      - inframind-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: inframind-qdrant
    ports:
      - "6333:6333"
    networks:
      - inframind-net

networks:
  inframind-net:
    driver: bridge