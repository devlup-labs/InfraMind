name: monitoring_cycle_15

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: monitoring_group
  cancel-in-progress: true

jobs:
  monitoring:
    name: Prometheus → Chronos Monitoring Cycle
    runs-on: ubuntu-latest

    env:
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_URL: ${{ vars.MODEL_URL }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Monitoring Cycle
        working-directory: ci_cd
        run: python model_predictions.py